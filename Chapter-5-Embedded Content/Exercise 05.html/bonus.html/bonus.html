<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!--Title of the website-->
        <title>The voice of Partridge</title>
        <!--Linking external stylesheet-->
        <link rel="stylesheet" href="style.css"/> 
    </head>
    <body>
        <!--Header Section-->
        <header>
            <!--Title of the soundboard-->
            <h1> 🎤 The voice of Partridge </h1>
            <!--Tagline to welcome user-->
            <p class="tagline"> Weelcome to a world of witty words & classy comedy — just press play & giggle away! </p>
        </header>
        <!--Class= Sound Grid -->
        <main class="grid">
            <!--Each sample contains a label and an audio-->
            <!--If you r gonna play the audio you will hear the sound-->
            <div class="sample"><p>Ah-Ha</p><audio controls src="Audio/ah-ha.mp3"></audio></div>
            <div class="sample"><p>Dan</p><audio controls src="Audio/dan.mp3"></audio></div>
            <div class="sample"><p>Back of the net</p><audio controls src="Audio/back-of-the-net.mp3"></audio></div>
            <div class="sample"><p>Bang out of order</p><audio controls src="Audio/bangoutoforder.mp3"></audio></div>
            <div class="sample"><p>Email of the Evening</p><audio controls src="Audio/emailoftheevening.mp3"></audio></div>
            <div class="sample"><p>Hello Partridge</p><audio controls src="Audio/hellopartridge.mp3"></audio></div>
            <div class="sample"><p>I ate scotch egg</p><audio controls src="Audio/iateascotchegg.mp3"></audio></div>
            <div class="sample"><p>I am confused</p><audio controls src="Audio/imconfused.mp3"></audio></div>
        </main>
</body>
</html>
